name: ASP.NET Core API CI-CD to IIS

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build-and-deploy:

    runs-on:
      - self-hosted
      - Windows
      - X64
      - iis

    steps:

      # 1. Checkout source code
      - name: Checkout Code
        uses: actions/checkout@v4


      # 2. Check installed .NET
      - name: Check .NET
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Checking installed .NET..."
          dotnet --version
          dotnet --info


      # 3. Restore NuGet packages
      - name: Restore
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Restoring project..."
          dotnet restore


      # 4. Build project
      - name: Build
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Building project..."
          dotnet build --configuration Release --no-restore


      # 5. Publish project
      - name: Publish
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $publishPath = "${{ github.workspace }}\publish"

          Write-Host "Publishing project..."
          Write-Host "Publish Path: $publishPath"

          if (Test-Path $publishPath) {
              Remove-Item $publishPath -Recurse -Force
          }

          dotnet publish `
            --configuration Release `
            --output $publishPath `
            --no-build

          Write-Host "Publish completed."


      # 6. Verify published files
      - name: Verify Publish
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $publishPath = "${{ github.workspace }}\publish"

          if (!(Test-Path $publishPath)) {
              throw "Publish folder was not created."
          }

          Write-Host "Published files:"
          Get-ChildItem $publishPath -Recurse


      # 7. Stop IIS Website
      - name: Stop IIS Website
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Import-Module WebAdministration

          if (Test-Path "IIS:\Sites\MyWebApi") {

              Write-Host "Stopping IIS website: MyWebApi"

              Stop-Website -Name "MyWebApi"

              Start-Sleep -Seconds 3

              Write-Host "IIS website stopped."
          }
          else {
              Write-Host "IIS website MyWebApi does not exist."
          }


      # 8. Prepare IIS deployment folder
      - name: Prepare IIS Folder
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $destination = "C:\inetpub\MyWebApi"

          Write-Host "Deployment folder: $destination"

          if (!(Test-Path $destination)) {

              Write-Host "Creating deployment folder..."

              New-Item `
                -ItemType Directory `
                -Path $destination `
                -Force | Out-Null
          }

          Write-Host "Deployment folder ready."


      # 9. Remove old files
      - name: Remove Old Files
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $destination = "C:\inetpub\MyWebApi"

          Write-Host "Removing old IIS files..."

          Get-ChildItem `
            -Path $destination `
            -Force `
            -ErrorAction SilentlyContinue |
            Remove-Item `
              -Recurse `
              -Force `
              -ErrorAction Stop

          Write-Host "Old files removed."


      # 10. Copy new published files
      - name: Deploy to IIS
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $source = "${{ github.workspace }}\publish"
          $destination = "C:\inetpub\MyWebApi"

          Write-Host "Source: $source"
          Write-Host "Destination: $destination"

          Copy-Item `
            -Path "$source\*" `
            -Destination $destination `
            -Recurse `
            -Force

          Write-Host "New files copied successfully."


      # 11. Start IIS Website
      - name: Start IIS Website
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Import-Module WebAdministration

          if (Test-Path "IIS:\Sites\MyWebApi") {

              Write-Host "Starting IIS website: MyWebApi"

              Start-Website -Name "MyWebApi"

              Start-Sleep -Seconds 3

              $site = Get-Website -Name "MyWebApi"

              Write-Host "IIS Site State: $($site.State)"

              if ($site.State -ne "Started") {
                  throw "IIS website MyWebApi failed to start."
              }

              Write-Host "IIS website started successfully."
          }
          else {
              throw "IIS website MyWebApi was not found."
          }


      # 12. Deployment completed
      - name: Deployment Completed
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "========================================"
          Write-Host " CI/CD DEPLOYMENT COMPLETED SUCCESSFULLY"
          Write-Host "========================================"
          Write-Host ""