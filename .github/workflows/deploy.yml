name: ASP.NET Core API CI-CD to IIS

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build-and-deploy:

    runs-on:
      - self-hosted
      - Windows
      - X64
      - iis

    steps:

      # 1. Checkout code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Check installed .NET
      - name: Check .NET
        shell: powershell
        run: |
          Write-Host "Checking installed .NET..."
          dotnet --version
          dotnet --info

      # 3. Restore
      - name: Restore
        shell: powershell
        run: |
          Write-Host "Restoring project..."
          dotnet restore

      # 4. Build
      - name: Build
        shell: powershell
        run: |
          Write-Host "Building project..."
          dotnet build --configuration Release --no-restore

      # 5. Publish
      - name: Publish
        shell: powershell
        run: |
          $publishPath = "${{ github.workspace }}\publish"

          if (Test-Path $publishPath) {
              Remove-Item $publishPath -Recurse -Force
          }

          dotnet publish `
            --configuration Release `
            --output $publishPath `
            --no-build

          Write-Host "Publish completed."

      # 6. Check published files
      - name: Check Publish Folder
        shell: powershell
        run: |
          $publishPath = "${{ github.workspace }}\publish"

          if (!(Test-Path $publishPath)) {
              Write-Error "Publish folder was not created."
              exit 1
          }

          Write-Host "Published files:"
          Get-ChildItem $publishPath -Recurse

      # 7. Stop IIS Website
      - name: Stop IIS Website
        shell: powershell
        run: |
          Import-Module WebAdministration

          if (Test-Path "IIS:\Sites\MyWebApi") {
              Write-Host "Stopping MyWebApi..."
              Stop-Website -Name "MyWebApi"
              Write-Host "MyWebApi stopped."
          }
          else {
              Write-Error "IIS website 'MyWebApi' was not found."
              exit 1
          }

      # 8. Deploy files to IIS
      - name: Deploy to IIS
        shell: powershell
        run: |
          $source = "${{ github.workspace }}\publish"
          $destination = "C:\inetpub\MyWebApi"

          Write-Host "Source: $source"
          Write-Host "Destination: $destination"

          if (!(Test-Path $source)) {
              Write-Error "Publish folder does not exist."
              exit 1
          }

          if (!(Test-Path $destination)) {
              New-Item -ItemType Directory -Path $destination -Force
          }

          Write-Host "Removing old files..."

          Get-ChildItem -Path $destination -Force |
              Remove-Item -Recurse -Force

          Write-Host "Copying new files..."

          Copy-Item `
            -Path "$source\*" `
            -Destination $destination `
            -Recurse `
            -Force

          Write-Host "Files deployed successfully."

      # 9. Start IIS Website
      - name: Start IIS Website
        shell: powershell
        run: |
          Import-Module WebAdministration

          if (Test-Path "IIS:\Sites\MyWebApi") {
              Start-Website -Name "MyWebApi"
              Write-Host "MyWebApi started successfully."
          }
          else {
              Write-Error "IIS website 'MyWebApi' was not found."
              exit 1
          }

      # 10. Deployment completed
      - name: Deployment Completed
        shell: powershell
        run: |
          Write-Host "======================================"
          Write-Host " CI/CD Deployment Completed Successfully"
          Write-Host "======================================"