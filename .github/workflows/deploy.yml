name: ASP.NET Core API CI-CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build-and-deploy:

    runs-on:
      - self-hosted
      - Windows
      - X64
      - iis

    steps:

      # 1. Checkout code
      - name: Checkout Code
        uses: actions/checkout@v4


      # 2. Check installed .NET
      - name: Check .NET
        shell: powershell
        run: |
          Write-Host "Checking .NET..."
          dotnet --version
          dotnet --info


      # 3. Restore
      - name: Restore
        shell: powershell
        run: |
          Write-Host "Restoring project..."
          dotnet restore


      # 4. Build
      - name: Build
        shell: powershell
        run: |
          Write-Host "Building project..."
          dotnet build --configuration Release --no-restore


      # 5. Publish
      - name: Publish
        shell: powershell
        run: |
          $publishPath = "${{ github.workspace }}\publish"

          Write-Host "Publishing project..."
          Write-Host "Publish path: $publishPath"

          if (Test-Path $publishPath) {
              Remove-Item $publishPath -Recurse -Force
          }

          dotnet publish --configuration Release --output $publishPath --no-build

          Write-Host "Publish completed."


      # 6. Check publish folder
      - name: Check Publish Folder
        shell: powershell
        run: |
          $publishPath = "${{ github.workspace }}\publish"

          Write-Host "Checking publish folder..."

          if (!(Test-Path $publishPath)) {
              throw "Publish folder does not exist."
          }

          Get-ChildItem $publishPath

          Write-Host "Publish folder verified."


      # 7. Stop IIS website
      - name: Stop IIS Website
        shell: powershell
        run: |
          Import-Module WebAdministration

          if (Test-Path "IIS:\Sites\MyWebApi") {

              Write-Host "Stopping MyWebApi..."

              Stop-Website -Name "MyWebApi"

              Start-Sleep -Seconds 2

              Write-Host "MyWebApi stopped."
          }
          else {
              Write-Host "MyWebApi website does not exist."
              Write-Host "Skipping stop operation."
          }


      # 8. Create IIS deployment folder
      - name: Create Deployment Folder
        shell: powershell
        run: |
          $destination = "C:\inetpub\MyWebApi"

          Write-Host "Deployment folder: $destination"

          if (!(Test-Path $destination)) {

              New-Item `
                -ItemType Directory `
                -Path $destination `
                -Force | Out-Null

              Write-Host "Deployment folder created."
          }
          else {
              Write-Host "Deployment folder already exists."
          }


      # 9. Remove old files
      - name: Remove Old Files
        shell: powershell
        run: |
          $destination = "C:\inetpub\MyWebApi"

          Write-Host "Removing old files..."

          if (Test-Path $destination) {

              Get-ChildItem `
                -Path $destination `
                -Force |
                Remove-Item `
                  -Recurse `
                  -Force
          }

          Write-Host "Old files removed."


      # 10. Copy new files
      - name: Deploy to IIS
        shell: powershell
        run: |
          $source = "${{ github.workspace }}\publish"
          $destination = "C:\inetpub\MyWebApi"

          Write-Host "Source: $source"
          Write-Host "Destination: $destination"

          if (!(Test-Path $source)) {
              throw "Publish folder not found."
          }

          if (!(Test-Path $destination)) {
              New-Item `
                -ItemType Directory `
                -Path $destination `
                -Force | Out-Null
          }

          Copy-Item `
            -Path "$source\*" `
            -Destination $destination `
            -Recurse `
            -Force

          Write-Host "New files copied to IIS."


      # 11. Start IIS website
      - name: Start IIS Website
        shell: powershell
        run: |
          Import-Module WebAdministration

          if (Test-Path "IIS:\Sites\MyWebApi") {

              Write-Host "Starting MyWebApi..."

              Start-Website -Name "MyWebApi"

              Start-Sleep -Seconds 2

              $site = Get-Website -Name "MyWebApi"

              Write-Host "Website State: $($site.State)"

          }
          else {
              Write-Host "MyWebApi website does not exist."
              Write-Host "Please check IIS website name."
          }


      # 12. Deployment completed
      - name: Deployment Completed
        shell: powershell
        run: |
          Write-Host "========================================"
          Write-Host " CI/CD DEPLOYMENT COMPLETED"
          Write-Host "========================================"