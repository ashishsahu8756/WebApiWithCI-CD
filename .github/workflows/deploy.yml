name: ASP.NET Core CI-CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build-and-deploy:

    runs-on: [self-hosted, Windows, X64, iis]

    steps:

      # 1. GitHub se code lena
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Server par installed .NET check karna
      - name: Check .NET
        shell: powershell
        run: |
          dotnet --info
          dotnet --version

      # 3. Restore
      - name: Restore
        shell: powershell
        run: |
          dotnet restore

      # 4. Build
      - name: Build
        shell: powershell
        run: |
          dotnet build --configuration Release --no-restore

      # 5. Publish
      - name: Publish
        shell: powershell
        run: |
          dotnet publish --configuration Release `
            --output "${{ github.workspace }}\publish" `
            --no-build

      # 6. Stop IIS website
      - name: Stop IIS Website
        shell: powershell
        run: |
          Import-Module WebAdministration
          Stop-Website -Name "MyWebApi"

      # 7. Deploy published files to IIS
      - name: Deploy to IIS
        shell: powershell
        run: |
          $source = "${{ github.workspace }}\publish"
          $destination = "C:\inetpub\MyWebApi"

          Write-Host "Source: $source"
          Write-Host "Destination: $destination"

          if (!(Test-Path $destination)) {
              New-Item -ItemType Directory -Path $destination -Force
          }

          Get-ChildItem -Path $destination -Force |
              Remove-Item -Recurse -Force

          Copy-Item -Path "$source\*" `
              -Destination $destination `
              -Recurse `
              -Force

      # 8. Start IIS website
      - name: Start IIS Website
        shell: powershell
        run: |
          Import-Module WebAdministration
          Start-Website -Name "MyWebApi"

      # 9. Deployment completed
      - name: Deployment Complete
        shell: powershell
        run: |
          Write-Host "CI/CD deployment completed successfully!"